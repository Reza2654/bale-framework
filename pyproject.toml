[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bale-framework"
version = "1.0.0"
description = "Universal, modular, production-ready application framework for Bale Messenger bots."
readme = "README.md"
authors = [
    { name = "Reza2654", email = "Rezamahdirs@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
redis = [
    "redis>=5.0.0",
]
webhook = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
